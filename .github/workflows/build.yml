name: Build App
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: actions/setup-node@v3
        with:
          node-version: "24.11"

      - name: Install arm64 cross-compile tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install dependencies
        run: npm install
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          npm_config_target: 40.0.0
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: npx esbuild src/backend/server.ts --bundle --platform=node --outfile=dist-server/server.js --external:better-sqlite3

      - name: Copy worker
        run: cp src/backend/db.worker.cjs dist-server/

      - name: Build and publish
        run: npx electron-builder -l --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++